name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      cross_repo:
        description: Check synchronized fixtures against the unpublished Avenger source revision
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TREE_SITTER: tree-sitter

jobs:
  parser:
    name: Parser (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.82.0
          components: clippy, rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.6
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
      - name: Install pinned Tree-sitter CLI outside the project dependency graph
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/tree-sitter" tree-sitter-cli@0.26.3
          echo "$RUNNER_TEMP/tree-sitter/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test Rust binding and conformance
        run: cargo test --release
      - name: Lint Rust targets
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Test corpus and captures
        run: |
          sh scripts/check_generated.sh --from-json
          tree-sitter test
          node scripts/test_highlights.mjs
          node scripts/test_compiler_fixtures.mjs
          node scripts/measure_parser.mjs --check
      - name: Test Wasm parser
        if: runner.os != 'Windows'
        run: |
          tree-sitter test --wasm
          node scripts/test_compiler_fixtures.mjs --wasm
      - name: Compile C sources with strict warnings
        if: runner.os != 'Windows'
        run: cc -std=c11 -Wall -Wextra -Wpedantic -Werror -Isrc -c src/parser.c src/scanner.c
      - name: Test synchronized scanner with sanitizers
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: sh scripts/test_scanner_sanitizers.sh
      - name: Audit Cargo package
        run: cargo package --list

  package:
    name: Package audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.82.0
      - name: Install immutable generation dependency
        run: npm ci
      - name: Audit npm archive
        run: npm pack --dry-run
      - name: Verify synchronized artifacts are represented in provenance
        run: |
          test -f vendor/avenger_sql_scanner.c
          test -f vendor/sql-base.json
          test -f test/fixtures/avenger-fixtures.json

  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.6
      - name: Install pinned Tree-sitter CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/tree-sitter" tree-sitter-cli@0.26.3
          echo "$RUNNER_TEMP/tree-sitter/node_modules/.bin" >> "$GITHUB_PATH"
      - run: tree-sitter fuzz --iterations 100 --edits 8

  cross-repository-generation:
    if: github.event_name == 'workflow_dispatch' && inputs.cross_repo
    runs-on: ubuntu-latest
    steps:
      - name: Check out combined grammar
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: tree-sitter-avenger
      - name: Check out immutable SQL base
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: avenger-vis/tree-sitter-avenger-sql
          ref: f2f0a63a8adfb593f1fb218202dd1fd55dc19546
          path: tree-sitter-avenger-sql
      - name: Check out immutable Avenger compiler contract
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: jonmmease/avenger
          ref: 2be2449685ad9e415decd962aef508fe4401f169
          path: avenger
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.6
          cache: npm
          cache-dependency-path: tree-sitter-avenger/package-lock.json
      - name: Install locked generation dependencies
        working-directory: tree-sitter-avenger
        run: npm ci
      - name: Verify immutable inputs and synchronized artifacts
        working-directory: tree-sitter-avenger
        run: |
          npm run sync:sql-base -- --sql-root ../tree-sitter-avenger-sql --check
          npm run sync:fixtures -- --avenger-root ../avenger --check
      - name: Regenerate the complete composed parser
        working-directory: tree-sitter-avenger
        run: npm run check-generated
