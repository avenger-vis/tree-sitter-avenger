name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TREE_SITTER: tree-sitter

jobs:
  parser:
    name: Parser (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.82.0
          components: clippy, rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.6
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
      - name: Install pinned Tree-sitter CLI outside the project dependency graph
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/tree-sitter" tree-sitter-cli@0.26.3
          echo "$RUNNER_TEMP/tree-sitter/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test Rust binding and conformance
        run: cargo test --release
      - name: Lint Rust targets
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Test corpus and captures
        run: |
          sh scripts/check_generated.sh --from-json
          tree-sitter test
          node scripts/test_highlights.mjs
          node scripts/test_compiler_fixtures.mjs
          node scripts/measure_parser.mjs --check
      - name: Test Wasm parser
        if: runner.os != 'Windows'
        run: |
          tree-sitter test --wasm
          node scripts/test_compiler_fixtures.mjs --wasm
      - name: Compile C sources with strict warnings
        if: runner.os != 'Windows'
        run: cc -std=c11 -Wall -Wextra -Wpedantic -Werror -Isrc -c src/parser.c src/scanner.c
      - name: Test synchronized scanner with sanitizers
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: sh scripts/test_scanner_sanitizers.sh
      - name: Audit Cargo package
        run: cargo package --list

  package:
    name: Package audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.82.0
      - name: Audit npm archive without resolving the local generation dependency
        run: npm pack --dry-run
      - name: Verify synchronized artifacts are represented in provenance
        run: |
          test -f vendor/avenger_sql_scanner.c
          test -f vendor/sql-base.json
          test -f test/fixtures/avenger-fixtures.json

  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.6
      - name: Install pinned Tree-sitter CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/tree-sitter" tree-sitter-cli@0.26.3
          echo "$RUNNER_TEMP/tree-sitter/node_modules/.bin" >> "$GITHUB_PATH"
      - run: tree-sitter fuzz --iterations 100 --edits 8
