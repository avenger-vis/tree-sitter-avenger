[package]
name = "tree-sitter-avenger"
description = "Tree-sitter grammar for the Avenger visualization language"
version = "0.1.0"
authors = ["Jon Mease", "Avenger contributors", "Derek Stride"]
license = "MIT"
readme = "README.md"
keywords = ["avenger", "incremental", "parsing", "tree-sitter"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/avenger-vis/tree-sitter-avenger"
edition = "2021"
rust-version = "1.82"
autoexamples = false
build = "bindings/rust/build.rs"
include = [
  "/LICENSE",
  "/README.md",
  "/SQL_BASE.md",
  "/bindings/c/**",
  "/bindings/rust/**",
  "/docs/**",
  "/grammar.js",
  "/grammar/**",
  "/queries/**",
  "/src/**",
  "/tree-sitter.json",
  "/vendor/sql-base.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "=0.26.3"
